<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Type specimen</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// lemo-plus specimen card. Lemo's renderer contract: window.READY = true once fonts load, window.render(t) draws.
// Query: i (pairing index), w, h, bg, ink, accent, title, sub (override specimens.json), still (a frame to sit on).
(async function () {
  const q = new URLSearchParams(location.search);
  const spec = await (await fetch('specimens.json', { cache: 'no-store' })).json();
  const i = Math.min(spec.pairings.length - 1, Math.max(0, +(q.get('i') || 0)));
  const P = spec.pairings[i];
  const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080), S = Math.min(W, H);
  const bg = q.get('bg') || '#efe7d6', ink = q.get('ink') || '#171512', accent = q.get('accent') || '#b4432e';
  const title = q.get('title') || spec.title, sub = q.get('sub') || spec.sub || 'A subtitle line, the way it will read';
  const cvs = document.getElementById('c');
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  const loaded = {};

  async function load(role) {
    const r = P.roles[role];
    if (!r) return null;
    const name = 'lp-' + role;
    const settings = Object.entries(r.axes || {}).filter(([k]) => k !== 'wght').map(([k, v]) => `"${k}" ${v}`).join(', ');
    for (const url of r.urls) {
      try {
        const ff = new FontFace(name, `url(${url})`, settings ? { variationSettings: settings } : {});
        document.fonts.add(await ff.load());
      } catch (e) { console.warn('font failed', url, e.message); }
    }
    loaded[role] = { name, wght: r.wght || 400, r };
    return loaded[role];
  }
  await Promise.all(['display', 'text', 'mono', 'accent'].map(load));
  let still = null;
  if (q.get('still')) {
    still = new Image(); still.src = q.get('still');
    await new Promise(ok => { still.onload = ok; still.onerror = () => { still = null; ok(); }; });
  }

  const font = (role, px, w) => { const f = loaded[role] || loaded.text || loaded.display; return `${w || f.wght} ${px}px "${f.name}"`; };
  // font size from a target cap height (phone minimums: 28 px on 1080-wide 9:16, 40 px on 1920x1080)
  const sizeFor = (role, cap) => cap / (((loaded[role] || {}).r || {}).metrics?.cap || 0.7);
  function wrap(text, maxW) {
    const words = text.split(/\s+/), lines = []; let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    if (lines.length > 1 && lines[lines.length - 1].split(' ').length === 1) {   // no one-word last line
      const prev = lines[lines.length - 2].split(' '); lines[lines.length - 1] = prev.pop() + ' ' + lines[lines.length - 1]; lines[lines.length - 2] = prev.join(' ');
    }
    return lines;
  }

  window.render = function () {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    if (still) { ctx.globalAlpha = 0.35; ctx.drawImage(still, 0, 0, W, H); ctx.globalAlpha = 1; }
    const m = S * 0.07; let y = m;
    ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ink;
    // label
    ctx.font = font('mono', Math.round(S * 0.022)); ctx.fillStyle = accent;
    ctx.fillText(`${i + 1} / ${spec.pairings.length}  ·  ${P.id}`, m, y + S * 0.022); y += S * 0.07;
    // title (T1)
    const tPx = Math.round(S * (W > H ? 0.11 : 0.13));
    ctx.font = font('display', tPx); ctx.fillStyle = ink;
    for (const l of wrap(title, W - 2 * m)) { y += tPx * 1.0; ctx.fillText(l, m, y); }
    y += tPx * 0.45;
    // subtitle (T3), sized from the phone minimum cap height
    const minCap = W > H ? 40 : 28;
    const sPx = Math.max(Math.round(S * 0.045), Math.round(sizeFor('text', minCap)));
    ctx.font = font('text', sPx);
    for (const l of wrap(sub, Math.min(W - 2 * m, sPx * 22))) { y += sPx * 1.3; ctx.fillText(l, m, y); }
    y += sPx * 0.8;
    // numerals in mono with tabular feel
    if (loaded.mono) { ctx.font = font('mono', Math.round(S * 0.04)); ctx.fillStyle = accent; y += S * 0.05; ctx.fillText('1820  ·  £0.06  ·  1,000 h  ·  0123456789', m, y); ctx.fillStyle = ink; }
    // accent word (mixed pairings)
    if (loaded.accent) { ctx.font = font('accent', Math.round(S * 0.08)); ctx.fillStyle = accent; y += S * 0.1; ctx.fillText('one word', m, y); ctx.fillStyle = ink; }
    // language test line
    ctx.font = font('text', Math.round(S * 0.03)); y += S * 0.07; ctx.fillText(spec.test, m, y);
    // footer: families, licences, why
    ctx.font = font('mono', Math.round(S * 0.018)); ctx.fillStyle = ink; ctx.globalAlpha = 0.7;
    const roles = Object.entries(P.roles).filter(([, r]) => r).map(([k, r]) => `${k}: ${r.family} ${r.wght} (${r.licence})`).join('   ');
    ctx.fillText(roles, m, H - m - S * 0.035);
    ctx.fillText(P.why.slice(0, 150), m, H - m);
    ctx.globalAlpha = 1;
  };
  window.render(0);
  window.READY = true;
})().catch(e => { console.error(e); document.body.textContent = 'specimen failed: ' + e.message; });
</script>
</body>
</html>
