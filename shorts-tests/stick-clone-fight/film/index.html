function runPose(ph) {
  const s = Math.sin(ph), c = Math.cos(ph);

    aF: 18 - 55 * s, eF: 85, aB: 18 + 55 * s, eB: 85 };

function resolve(p, tau) {

  return P[p];

// ---------------------------------------------------------------- choreography: [tau, pose, {x, air, sx, spin, eye, hide, e, ea, ex}]
// fields carry forward; e = ease of the pose/sx/spin into this key, ex for x, ea for air (default e)

const TRAILS = { H: [[6.0, 6.2], [7.46, 7.7], [8.4, 8.95], [10.55, 10.78], [11.46, 11.82]], C1: [[5.1, 5.8], [6.1, 6.45]],

function figState(F, tau) {
  const K = F.keys; let i = 0; while (i < K.length - 1 && K[i + 1].t <= tau) i++;
  const a = K[i], b = K[Math.min(i + 1, K.length - 1)];
  if (b === a || tau <= a.t) return { pose: resolve(a.p, tau), x: a.x, air: a.air, sx: a.sx, spin: a.spin, eye: a.eye, hide: a.hide };
  const u = (tau - a.t) / (b.t - a.t), w = EASE[b.e](u), wx = EASE[b.ex](u), wa = EASE[b.ea](u);
  const pa = resolve(a.p, tau), pb = resolve(b.p, tau), pose = {};
  for (const k of PK) pose[k] = lerp(pa[k], pb[k], w);
  return { pose, x: lerp(a.x, b.x, wx), air: lerp(a.air, b.air, wa), sx: lerp(a.sx, b.sx, w), spin: lerp(a.spin, b.spin, w), eye: lerp(a.eye, b.eye, w), hide: a.hide };
}

// ---------------------------------------------------------------- skeleton
const LEN = { th: 60, sh: 62, ua: 46, fa: 46, tor: 84, neck: 12, hr: 21 };
const dir = a => (a *= D2R, [Math.sin(a), Math.cos(a)]);
function joints(st) {
  const p = st.pose, tr = p.t * D2R, up = [Math.sin(tr), -Math.cos(tr)], J = { hip: [0, 0] };
  J.neck = [up[0] * LEN.tor, up[1] * LEN.tor];
  const hr = (p.t + p.h) * D2R, hu = [Math.sin(hr), -Math.cos(hr)], hf = [Math.cos(hr), Math.sin(hr)], d = LEN.neck + LEN.hr;
  J.head = [J.neck[0] + hu[0] * d, J.neck[1] + hu[1] * d];
  J.eye = [J.head[0] + hf[0] * LEN.hr * .5 + hu[0] * 3, J.head[1] + hf[1] * LEN.hr * .5 + hu[1] * 3];
  J.sh = [up[0] * (LEN.tor - 6), up[1] * (LEN.tor - 6)];
  for (const s of ['F', 'B']) {
    const d1 = dir(p['a' + s]), d2 = dir(p['a' + s] + p['e' + s]);
    J['e' + s] = [J.sh[0] + d1[0] * LEN.ua, J.sh[1] + d1[1] * LEN.ua]; J['h' + s] = [J['e' + s][0] + d2[0] * LEN.fa, J['e' + s][1] + d2[1] * LEN.fa];
    const l1 = dir(p['l' + s]), l2 = dir(p['l' + s] + p['k' + s]);
    J['k' + s] = [l1[0] * LEN.th, l1[1] * LEN.th]; J['f' + s] = [J['k' + s][0] + l2[0] * LEN.sh, J['k' + s][1] + l2[1] * LEN.sh];
  }
  const r = st.spin * D2R, c = Math.cos(r), sn = Math.sin(r);
  let low = 0;
  for (const k in J) { const [x, y] = J[k]; J[k] = [(x * c - y * sn) * st.sx, x * sn + y * c]; if (k !== 'eye') low = Math.max(low, J[k][1] + (k === 'head' ? LEN.hr : 0)); }
  const hy = -(low + 6) - st.air;
  for (const k in J) J[k] = [J[k][0] + st.x, J[k][1] + hy];
  J.eyeA = st.eye ?? 1; J.sxv = st.sx; return J;
}

// ---------------------------------------------------------------- drawing a figure
function pathLimbs(ctx, J, side) {
  ctx.beginPath();
  ctx.moveTo(...J.sh); ctx.lineTo(...J['e' + side]); ctx.lineTo(...J['h' + side]);
  ctx.moveTo(...J.hip); ctx.lineTo(...J['k' + side]); ctx.lineTo(...J['f' + side]);
}
function pathBody(ctx, J) { pathLimbs(ctx, J, 'F'); ctx.moveTo(...J.hip); ctx.lineTo(...J.neck); }
function drawFig(ctx, J, kind, z, o = {}) {
  const lw = o.lw || 11, a = o.alpha ?? 1;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = a;
  const head = () => { ctx.beginPath(); ctx.arc(J.head[0], J.head[1], LEN.hr, 0, Math.PI * 2); };
  if (kind === 'sil' || kind === 'ghost') {
    ctx.strokeStyle = ctx.fillStyle = o.color; ctx.lineWidth = lw;
    pathLimbs(ctx, J, 'B'); ctx.stroke(); pathBody(ctx, J); ctx.stroke(); head(); ctx.fill();
  } else if (kind === 'hero') {
    ctx.shadowColor = 'rgba(110,225,255,.95)'; ctx.shadowBlur = 26 * S * z;
    ctx.strokeStyle = '#9fb4cb'; ctx.lineWidth = lw; pathLimbs(ctx, J, 'B'); ctx.stroke();
    ctx.strokeStyle = '#f4f9ff'; pathBody(ctx, J); ctx.stroke(); ctx.fillStyle = '#f4f9ff'; head(); ctx.fill();
  } else {   // clone: red rim glow under a near-black body, a red eye slit
    const rim = o.rim ?? 1;
    for (const side of ['B', 'F']) {
      const p = () => side === 'B' ? pathLimbs(ctx, J, 'B') : (pathBody(ctx, J));
      ctx.shadowColor = rgba(RED, .9 * rim); ctx.shadowBlur = 18 * S * z; ctx.strokeStyle = rgba(side === 'B' ? [170, 25, 40] : RED, rim); ctx.lineWidth = lw + 5; p(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = side === 'B' ? '#08080b' : '#111217'; ctx.lineWidth = lw; p(); ctx.stroke();
    }
    ctx.shadowColor = rgba(RED, .9 * rim); ctx.shadowBlur = 18 * S * z; ctx.fillStyle = rgba(RED, rim); head(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#111217'; ctx.beginPath(); ctx.arc(J.head[0], J.head[1], LEN.hr - 3, 0, Math.PI * 2); ctx.fill();
    if (J.eyeA > .01) {
      const dx = J.eye[0] - J.head[0], dy = J.eye[1] - J.head[1], an = Math.atan2(dy, dx);
      ctx.save(); ctx.translate(...J.eye); ctx.rotate(an + Math.PI / 2); ctx.globalAlpha = a * J.eyeA;
      ctx.shadowColor = 'rgba(255,60,60,1)'; ctx.shadowBlur = 22 * S * z; ctx.fillStyle = '#ffd0d0';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 2.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.fill(); ctx.restore();
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------- the bay: tubes
const TUBES = [{ x: -920, f: 1 }, { x: -560, f: -1 }, { x: -200, broken: 1 }, { x: 200, fig: 'C1' }, { x: 520, fig: 'C2' }, { x: 840, fig: 'C3' }, { x: 1160, f: -1 }, { x: 1480, f: 1 }];

const GLASS = { x0: -70, x1: 70, y0: -430, y1: -54 };
function revealAt(x) { return TL.reveal + Math.abs(x - 120) / 1700 * 1.3; }
function tubeRed(T, tau) {
  if (T.fig) return smooth((tau - 2.85) / .5);

    const gw = X.createRadialGradient(0, 0, 0, 0, 0, 900); gw.addColorStop(0, rgba(RED, .22 * al)); gw.addColorStop(1, rgba(RED, 0));
    X.fillStyle = gw; X.beginPath(); X.moveTo(0, 0); X.arc(0, 0, 900, a, a + .35); X.closePath(); X.fill();
    X.beginPath(); X.moveTo(0, 0); X.arc(0, 0, 900, a + Math.PI, a + Math.PI + .35); X.closePath(); X.fill(); X.restore();
  }
}

// ---------------------------------------------------------------- frame
const HUD = ['CLONE BAY 04  //  SUBLEVEL 9', 'SUBJECT 07  //  STATUS: AWAKE'];
let GRAIN = [];
function buildGrain() { for (let k = 0; k < 4; k++) { const c = mk(256, 256), x = c.getContext('2d'), im = x.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); GRAIN.push(c); } }
const BAR = Math.round((H - W / 2.39) / 2);

function visibleFigs(tau) {
  const L = [];
  for (const id of ['C1', 'C2', 'C3', 'H']) { const F = FIG[id], st = figState(F, tau); if (st.hide) continue; L.push({ id, F, st, J: joints(st), inTube: F.tube !== undefined && tau < TL.shatter }); }
  return L;
}
function drawMain(ctx, tau, t, cam, figs) {
  const z = cam.z, end = smooth((tau - 12.7) / .6);
  for (const T of TUBES) {
    drawTubeBack(ctx, T, tau, end * (1 - tubeRed(T, tau)));
    if (!T.fig && !T.broken) { const J = joints({ pose: P.float, x: T.x, air: 110 + 6 * Math.sin(tau * 1.3 + T.i), sx: T.f, spin: 0, eye: smooth((tau - revealAt(T.x) - .15) / .2) }); drawFig(ctx, J, 'clone', z, { rim: .35 + .65 * tubeRed(T, tau) }); }
    const f = figs.find(g => g.inTube && FIG[g.id].tube === T.i);
    if (f) { const J = joints({ ...f.st, air: f.st.air + 6 * Math.sin(tau * 1.3 + T.i) }); drawFig(ctx, J, 'clone', z, { rim: .35 + .65 * tubeRed(T, tau) }); }
    drawTubeFront(ctx, T, tau);
    drawPuddle(ctx, T, tau);
  }
  drawFloorCrack(ctx, tau);
  // trails, then figures
  for (const g of figs) {
    if (g.inTube) continue;
    for (const [a, b] of TRAILS[g.id] || []) if (tau > a && tau < b) {
      for (let i = 5; i >= 1; i--) { const J = joints(figState(g.F, tau - i * .02)); drawFig(ctx, J, 'ghost', z, { color: g.F.kind === 'hero' ? 'rgba(120,220,255,1)' : 'rgba(255,50,70,1)', alpha: .22 * (1 - i / 6), lw: 9 }); }
    }
  }
  for (const g of figs) if (!g.inTube) drawFig(ctx, g.J, g.F.kind, z);
  for (const T of TUBES) if (shattered(T, tau)) drawShards(ctx, T, tau);
  drawDust(ctx, tau);
  drawSparks(ctx, tau);
}

function draw(t) {
  const tau = tauOf(t), cam = camAt(tau, t), sh = shakeAt(t), M = camM(cam, 1, sh), al = alarmAt(tau), slow = 1 - speed(tau);
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1; X.filter = 'none';
  if (tau >= TL.black) return drawTitle(tau, t);
  drawBackground(tau, t, cam, sh);
  const figs = visibleFigs(tau);
  // main layer (tubes, fighters, particles) on its own canvas, so the floor can reflect it
  LX.setTransform(1, 0, 0, 1, 0, 0); LX.clearRect(0, 0, W, H); LX.setTransform(M); drawMain(LX, tau, t, cam, figs);
  // floor
  X.setTransform(M);
  const fl = X.createLinearGradient(0, 0, 0, 700); fl.addColorStop(0, '#0b1016'); fl.addColorStop(1, '#020305');
  X.fillStyle = fl; X.fillRect(-6000, 0, 12000, 3000);
  X.strokeStyle = 'rgba(120,170,200,.07)'; X.lineWidth = 1.5; for (let y = 30; y < 900; y *= 1.45) { X.beginPath(); X.moveTo(-6000, y); X.lineTo(6000, y); X.stroke(); }
  X.save(); X.beginPath(); X.rect(-6000, 0, 12000, 3000); X.clip();
  const R = M.multiply(new DOMMatrix([1, 0, 0, -1, 0, 0])).multiply(M.inverse());
  X.setTransform(R); X.globalAlpha = .22; X.drawImage(LAY, 0, 0); X.globalAlpha = 1;
  X.setTransform(M); const fade = X.createLinearGradient(0, 0, 0, 420); fade.addColorStop(0, 'rgba(3,5,8,.15)'); fade.addColorStop(1, 'rgba(3,5,8,1)'); X.fillStyle = fade; X.fillRect(-6000, 0, 12000, 3000);
  X.restore();
  X.fillStyle = rgba(mixc(CYAN, RED, al), .25); X.fillRect(-6000, 0, 12000, 2);
  // the main layer itself
  X.setTransform(1, 0, 0, 1, 0, 0); X.drawImage(LAY, 0, 0);
  // light shafts above the tubes and floating dust
  X.setTransform(M); X.save(); X.globalCompositeOperation = 'lighter';
  for (const T of TUBES) { const lc = liquidCol(T, tau), g = X.createLinearGradient(0, -900, 0, 0); g.addColorStop(0, rgba(lc, .0)); g.addColorStop(.6, rgba(lc, .05)); g.addColorStop(1, rgba(lc, .09));
    X.fillStyle = g; X.beginPath(); X.moveTo(T.x - 60, -900); X.lineTo(T.x + 60, -900); X.lineTo(T.x + 190, 0); X.lineTo(T.x - 190, 0); X.closePath(); X.fill(); }
  for (let i = 0; i < 70; i++) { const x = -1400 + 2800 * rnd(i), y = -800 + 800 * ((rnd(i + 3) + tau * .02 * (1 + rnd(i + 5))) % 1); X.fillStyle = `rgba(200,230,255,${.12 + .2 * rnd(i + 7)})`; X.beginPath(); X.arc(x + 20 * Math.sin(tau * .6 + i), y, 1.4 + 1.6 * rnd(i + 9), 0, Math.PI * 2); X.fill(); }
  X.restore();
  // grade: alarm tint, teal shadows, the closing darkness
  X.setTransform(1, 0, 0, 1, 0, 0);
  if (al > 0) { X.globalCompositeOperation = 'soft-light'; X.fillStyle = rgba(RED, .55 * al * (.65 + .35 * Math.sin(t * 9))); X.fillRect(0, 0, W, H); }
  X.globalCompositeOperation = 'soft-light'; X.fillStyle = 'rgba(20,90,110,.35)'; X.fillRect(0, 0, W, H);
  X.globalCompositeOperation = 'source-over';
  // speed lines in slow motion
  if (slow > .05) {
    const k = slow / .88, fr = Math.floor(t * 30); X.save(); X.translate(W / 2, H / 2); X.strokeStyle = `rgba(255,255,255,${.22 * k})`;
    for (let i = 0; i < 70; i++) { const a = rnd(fr * 7 + i) * Math.PI * 2, r0 = (.55 + .35 * rnd(fr + i * 3)) * W * .5, r1 = W * .75; X.lineWidth = (1 + 3 * rnd(i + fr)) * S; X.beginPath(); X.moveTo(Math.cos(a) * r0, Math.sin(a) * r0 * .7); X.lineTo(Math.cos(a) * r1, Math.sin(a) * r1 * .7); X.stroke(); }
    X.restore();
  }
  // impact frames: two frames of black-on-white, white-on-black
  for (const m of TL.impacts) if (m.flash) {
    const d = t - realOf(m.tau); if (d < 0 || d >= 2 / 30) continue; const inv = d >= 1 / 30;
    X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = inv ? '#000' : '#fff'; X.fillRect(0, 0, W, H);
    X.setTransform(M); for (const g of figs) drawFig(X, g.J, 'sil', cam.z, { color: inv ? '#fff' : '#000', lw: 14 }); drawSparks(X, tau, inv ? '#fff' : '#000');
  }
  post(tau, t);
  // HUD typing at the start
  X.setTransform(1, 0, 0, 1, 0, 0);
  const ht = clamp((tau - .4) / 1.6), hf = 1 - smooth((tau - 2.45) / .3);
  if (hf > 0 && ht > 0) {
    X.font = `${Math.round(22 * S)}px Consolas, monospace`; X.textBaseline = 'alphabetic'; X.textAlign = 'left'; X.fillStyle = `rgba(150,235,255,${.85 * hf})`;
    const all = HUD.join('\n'), n = Math.floor(all.length * ht), shown = all.slice(0, n).split('\n');
    shown.forEach((s, i) => X.fillText(s + (i === shown.length - 1 && Math.floor(t * 3) % 2 ? '_' : ''), 70 * S, H - BAR - (70 - i * 34) * S));
  }
  bars();
}
function post(tau, t) {
  X.setTransform(1, 0, 0, 1, 0, 0);
  BX.setTransform(1, 0, 0, 1, 0, 0); BX.filter = 'none'; BX.clearRect(0, 0, BL.width, BL.height);
  BX.filter = 'brightness(.7) contrast(2.4) blur(5px)'; BX.drawImage(out, 0, 0, BL.width, BL.height); BX.filter = 'none';
  X.globalCompositeOperation = 'lighter'; X.globalAlpha = .55; X.drawImage(BL, 0, 0, W, H); X.globalAlpha = 1;
  const v = X.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)');
  X.globalCompositeOperation = 'source-over'; X.fillStyle = v; X.fillRect(0, 0, W, H);
  const gi = Math.floor(t * 30) % 4; X.globalCompositeOperation = 'overlay'; X.globalAlpha = .1; X.fillStyle = X.createPattern(GRAIN[gi], 'repeat');
  X.save(); X.translate(rnd(Math.floor(t * 30)) * 256, rnd(Math.floor(t * 30) + 1) * 256); X.fillRect(-256, -256, W + 512, H + 512); X.restore();
  X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
}
function bars() { X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, W, BAR); X.fillRect(0, H - BAR, W, BAR); }
function drawTitle(tau, t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  const a = smooth((tau - 16.15) / .45) * (1 - smooth((tau - 17.4) / .35));
  if (a > 0) {
    X.textAlign = 'center'; X.textBaseline = 'middle'; X.globalAlpha = a;
    X.font = `300 ${Math.round(150 * S)}px Bahnschrift, Segoe UI, sans-serif`; X.fillStyle = '#eef6ff'; X.shadowColor = 'rgba(120,220,255,.8)'; X.shadowBlur = 30 * S;
    if ('letterSpacing' in X) X.letterSpacing = `${Math.round(48 * S)}px`;
    X.fillText('CLONE', W / 2 + 24 * S, H / 2 - 20 * S);
    if ('letterSpacing' in X) X.letterSpacing = `${Math.round(12 * S)}px`;
    X.shadowColor = rgba(RED); X.shadowBlur = 16 * S; X.fillStyle = rgba(RED); X.font = `500 ${Math.round(26 * S)}px Bahnschrift, Segoe UI, sans-serif`;
    X.fillText('SUBJECT 07', W / 2 + 6 * S, H / 2 + 90 * S);
    X.shadowBlur = 0; X.globalAlpha = 1; if ('letterSpacing' in X) X.letterSpacing = '0px';
  }
  post(tau, t); bars();
}

window.render = x => draw(RATE ? x / RATE : x);
fetch('tl.json').then(r => r.json()).then(async j => {
  TL = j; buildMap(); buildArmy(); buildGrain();
  window.DUR_REAL = realOf(TL.dur);
  await document.fonts.ready; draw(0); window.READY = true;
});
</script></body></html>
