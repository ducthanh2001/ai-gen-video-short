  [[12.0, 80, -330, 1.25, 0], [12.6, 100, -330, 1.3, 0], [13.4, 20, -300, 1.5, 0], [14.0, -50, -310, 1.45, 2], [14.4, -110, -320, 1.5, 0],
   [14.6, -60, -340, 1.85, 6], [14.72, -50, -340, 1.9, 6], [15.2, 40, -270, 1.45, 0], [16.25, 0, -340, 1.22, 0]],
  [[20.25, 0, -380, 1.12, 0], [22.0, 0, -340, 1.25, 0], [23.4, 40, -300, 1.5, 0], [23.9, -60, -330, 1.4, 0], [24.36, -60, -280, 1.8, -5],
   [24.56, -60, -280, 1.85, -5], [24.9, -100, -420, 1.4, 0], [25.5, 0, -340, 1.25, 0]],
  [[25.5, 0, -340, 1.25, 0], [27.4, 20, -330, 1.35, 0], [28.5, 50, -310, 1.45, 0], [29.7, 30, -300, 1.6, 0], [31.2, 20, -330, 1.38, 0], [31.75, 20, -330, 1.36, 0]],
];
function buildShots() {
  const M = [];
  TL.beats.forEach((b, i) => {
    const r = i % 2 ? 6 : -6, zx = [40, 70, 30, 60, 50][i];
    M.push([[b, zx, -260, 1.75, r], [b + .55, zx + 10, -255, 1.9, r * 1.2]]);
    M.push([[b + .55, 0, -420, 1.0, 0], [b + .8, 0, -400, 1.04, 0]]);
  });
  M.unshift([[16.25, 0, -340, 1.22, 0], [16.5, 0, -400, 1.05, 0]]);
  SHOTS = SHOTS.concat(M).sort((a, b) => a[0][0] - b[0][0]);
}
function hermite(K, tau, c) {
  if (K.length === 1 || tau <= K[0][0]) return K[0][c]; if (tau >= K[K.length - 1][0]) return K[K.length - 1][c];
  let i = 0; while (i < K.length - 2 && K[i + 1][0] <= tau) i++;
  const a = K[i], b = K[i + 1], h = b[0] - a[0], u = (tau - a[0]) / h;
  const sl = j => (j <= 0 || j >= K.length - 1) ? 0 : ((K[j + 1][c] - K[j][c]) / (K[j + 1][0] - K[j][0]) + (K[j][c] - K[j - 1][c]) / (K[j][0] - K[j - 1][0])) / 2;
  const m0 = sl(i) * h, m1 = sl(i + 1) * h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * a[c] + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * b[c] + (u3 - u2) * m1;
}
function camAt(tau, t) {
  let K = SHOTS[0]; for (const s of SHOTS) if (tau >= s[0][0]) K = s;
  const mv = moving(tau) ? 1 : 0;
  return { x: hermite(K, tau, 1) + 4 * Math.sin(t * .7), y: hermite(K, tau, 2) + 3 * Math.sin(t * 1.1) + mv * 1.6 * Math.sin(t * 57), z: hermite(K, tau, 3) * 1.28, r: hermite(K, tau, 4) };
}
function shakeAt(t) {
  let x = 0, y = 0;
  for (const m of TL.impacts) { const d = t - realOf(m.tau); if (d < 0 || d > 1) continue; const a = m.shake * .8 * Math.exp(-d / .2);
    x += a * (Math.sin(d * 34 + m.tau) * .6 + Math.sin(d * 47) * .4); y += a * (Math.sin(d * 39 + 2) * .6 + Math.sin(d * 53 + m.tau) * .4); }
  return [x * S, y * S];
}
function camM(cam, sh) { const z = cam.z * S, m = new DOMMatrix(); m.translateSelf(W / 2 + sh[0], H / 2 + sh[1]); m.rotateSelf(cam.r); m.scaleSelf(z, z); m.translateSelf(-cam.x, -cam.y); return m; }

// ---------------------------------------------------------------- frame
const ORDER = ['TA', 'ST', 'BR', 'M0', 'M1', 'M2', 'M3', 'M4', 'NJ', 'H'];
function figsAt(tau) { const L = []; for (const id of ORDER) { const F = FIG[id], st = figState(F, tau); if (st.hide) continue; L.push({ id, F, st, J: joints(st) }); } return L; }
let CUR_DOOR = 1;
function withDepth(ctx, d, fn) {
  if (d <= .001) return fn(); const s = 1 / (1 + .22 * d);
  ctx.save(); if (d > .5) { const g = 150 * CUR_DOOR; ctx.beginPath(); ctx.rect(150 - g, DOOR.top, 2 * g, -DOOR.top + 4); ctx.clip(); }
  ctx.translate(...VP); ctx.scale(s, s); ctx.translate(-VP[0], -VP[1]); fn(); ctx.restore();
}
function drawFighter(ctx, g, tau, z, sil) {
  withDepth(ctx, g.st.d, () => {
    const kind = sil ? 'sil' : g.F.kind;
    if (g.st.prop && g.id !== 'NJ') drawStaff(ctx, g.J.hF, propDir(g.J, g.st.pa), sil);
    drawFig(ctx, g.J, kind, z, { col: g.F.col, color: sil });
    if (g.F.knife) drawKnife(ctx, g.J, sil);
  });
}
const TRAILS = { H: [[4.28, 4.45], [8.3, 8.6], [9.15, 9.45], [13.8, 14.0], [14.4, 14.8], [24.62, 24.85]], TA: [[4.36, 4.7]], ST: [[8.3, 8.4], [8.9, 9.0], [9.38, 9.7]],
  BR: [[13.85, 14.0], [14.75, 15.3]], NJ: [[23.85, 24.05], [24.4, 24.5], [24.78, 25.1]] };
function drawTrails(ctx, g, tau, z) {
  const W2 = (TRAILS[g.id] || []).slice(); if (g.id === 'H' || g.id[0] === 'M') for (const b of TL.beats) W2.push([b + .18, b + .45]);
  for (const [a, b] of W2) if (tau > a && tau < b) for (let i = 4; i >= 1; i--) {
    const st = figState(g.F, tau - i * .02); if (st.hide) continue; const J = joints(st);
    withDepth(ctx, st.d, () => drawFig(ctx, J, 'ghost', z, { color: g.F.kind === 'hero' ? 'rgba(120,220,255,1)' : rgba(g.F.col), alpha: .2 * (1 - i / 5), lw: 9 }));
  }
}
let GRAIN = [];
function buildGrain() { for (let k = 0; k < 4; k++) { const c = mk(256, 256), x = c.getContext('2d'), im = x.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); GRAIN.push(c); } }

function draw(t) {
  const tau = tauOf(t), cam = camAt(tau, t), sh = shakeAt(t), M = camM(cam, sh), light = lightAt(tau), slow = 1 - speed(tau);
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1; X.filter = 'none';
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  X.setTransform(M);
  drawShaft(X, tau, light);
  drawCarBack(X, tau, light);
  const figs = figsAt(tau);
  CUR_DOOR = doorAt(tau);
  // fighters standing in the doorway are behind the door panels' plane only when the doors are shut; they are clipped to the doorway
  carLight(X, light);
  for (const g of figs) drawTrails(X, g, tau, cam.z);
  for (const g of figs) if (g.st.d > .5) drawFighter(X, g, tau, cam.z);
  drawDamage(X, tau);
  for (const g of figs) if (g.st.d <= .5) drawFighter(X, g, tau, cam.z);
  freeStaff(X, tau); drawDebris(X, tau);
  drawCarFrame(X, tau, light);
  drawSparks(X, tau);
  // grade
  X.setTransform(1, 0, 0, 1, 0, 0);
  X.globalCompositeOperation = 'soft-light'; X.fillStyle = 'rgba(30,70,90,.3)'; X.fillRect(0, 0, W, H); X.globalCompositeOperation = 'source-over';
  if (slow > .05) {
    const k = slow / .8, fr = Math.floor(t * 30); X.save(); X.translate(W / 2, H / 2); X.strokeStyle = `rgba(255,255,255,${.2 * k})`;
    for (let i = 0; i < 70; i++) { const a = rnd(fr * 7 + i) * Math.PI * 2, r0 = (.5 + .35 * rnd(fr + i * 3)) * H * .5, r1 = H * .7; X.lineWidth = (1 + 3 * rnd(i + fr)) * S;
      X.beginPath(); X.moveTo(Math.cos(a) * r0 * .56, Math.sin(a) * r0); X.lineTo(Math.cos(a) * r1 * .56, Math.sin(a) * r1); X.stroke(); }
    X.restore();
  }
  for (const m of TL.impacts) if (m.flash) {
    const d = t - realOf(m.tau); if (d < 0 || d >= 2 / 30) continue; const inv = d >= 1 / 30;
    X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = inv ? '#000' : '#fff'; X.fillRect(0, 0, W, H);
    X.setTransform(M); for (const g of figs) drawFighter(X, g, tau, cam.z, inv ? '#fff' : '#000'); drawSparks(X, tau, inv ? '#fff' : '#000');
  }
  post(t);
  // title at the start
  const ta = smooth((tau - .3) / .5) * (1 - smooth((tau - 2.1) / .4));
  if (ta > 0) {
    X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = ta; X.textAlign = 'center'; X.textBaseline = 'middle';
    X.font = `300 ${Math.round(96 * S)}px Bahnschrift, Segoe UI, sans-serif`; X.fillStyle = '#f2f7ff'; X.shadowColor = 'rgba(255,190,90,.8)'; X.shadowBlur = 24 * S;
    if ('letterSpacing' in X) X.letterSpacing = `${Math.round(30 * S)}px`; X.fillText('ELEVATOR', W / 2 + 15 * S, 230 * S);
    if ('letterSpacing' in X) X.letterSpacing = '0px'; X.shadowBlur = 0; X.globalAlpha = 1;
  }
  // the last frames dip to black so the loop restarts on a cut
  const bk = smooth((tau - 31.45) / .25); if (bk > 0) { X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = `rgba(0,0,0,${bk})`; X.fillRect(0, 0, W, H); }
}
function post(t) {
  X.setTransform(1, 0, 0, 1, 0, 0);
  BX.setTransform(1, 0, 0, 1, 0, 0); BX.filter = 'none'; BX.clearRect(0, 0, BL.width, BL.height);
  BX.filter = 'brightness(.7) contrast(2.4) blur(5px)'; BX.drawImage(out, 0, 0, BL.width, BL.height); BX.filter = 'none';
  X.globalCompositeOperation = 'lighter'; X.globalAlpha = .5; X.drawImage(BL, 0, 0, W, H); X.globalAlpha = 1;
  const v = X.createRadialGradient(W / 2, H / 2, W * .35, W / 2, H / 2, H * .62); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.65)');
  X.globalCompositeOperation = 'source-over'; X.fillStyle = v; X.fillRect(0, 0, W, H);
  const fr = Math.floor(t * 30); X.globalCompositeOperation = 'overlay'; X.globalAlpha = .1; X.fillStyle = X.createPattern(GRAIN[fr % 4], 'repeat');
  X.save(); X.translate(rnd(fr) * 256, rnd(fr + 1) * 256); X.fillRect(-256, -256, W + 512, H + 512); X.restore();
  X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
}

window.render = x => draw(RATE ? x / RATE : x);
fetch('tl.json').then(r => r.json()).then(async j => {
  TL = j; buildMap(); buildMontage(); buildShots(); buildGrain();
  for (const b of TL.beats) DOOR_K.push([b - .001, 0, 'l'], [b, 1, 'l'], [b + .55, 1, 'l'], [b + .551, 0, 'l']);
  DOOR_K.sort((a, b) => a[0] - b[0]);
  window.DUR_REAL = realOf(TL.dur);
  await document.fonts.ready; draw(0); window.READY = true;
});
</script></body></html>
