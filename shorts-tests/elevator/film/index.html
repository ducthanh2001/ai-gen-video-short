function hermite(K, tau, c) {
  if (K.length === 1 || tau <= K[0][0]) return K[0][c]; if (tau >= K[K.length - 1][0]) return K[K.length - 1][c];

  const sl = j => (j <= 0 || j >= K.length - 1) ? 0 : ((K[j + 1][c] - K[j][c]) / (K[j + 1][0] - K[j][0]) + (K[j][c] - K[j - 1][c]) / (K[j][0] - K[j - 1][0])) / 2;

  return (2 * u3 - 3 * u2 + 1) * a[c] + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * b[c] + (u3 - u2) * m1;
}
function shakeAt(t) {

}

// ---------------------------------------------------------------- frame
let GRAIN = [];
function buildGrain() { for (let k = 0; k < 4; k++) { const c = mk(256, 256), x = c.getContext('2d'), im = x.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); GRAIN.push(c); } }
function draw(t) {

}
function post(t) {

// ---------------------------------------------------------------- thumbnails (?thumb=A or ?thumb=B)

function thumbB() {
