    // Gaia pops in
    const gaia = { kind: 'gaia', x: CRETE[0] + 340, y: CRETE[1] + 40, s: 175, t, ph: 1, pop: pop(t, 3.0, 0.45), expr: t < 5.4 ? 'neutral' : 'smile', look: -0.6, flip: true };
    bust(gaia);
    // baby: held by Rhea -> Gaia -> cave
    const held = [rpos[0] + 90, rpos[1] + 100], gb = [gaia.x - 90, gaia.y + 100];
    let bp = held, bs = 105 * pop(t, 1.7, 0.4);
    if (t > 3.9) { const u = sm((t - 3.9) / 0.8); bp = bez(held, [(held[0] + gb[0]) / 2, held[1] - 150], gb, u); }
    if (t > 4.9) { const u = sm((t - 4.9) / 0.6); bp = [gb[0] + (CAVE[0] - gb[0]) * u, gb[1] + (CAVE[1] - 30 - gb[1]) * u]; bs *= 1 - 0.45 * u; }
    if (t < 5.5) bundle(bp[0], bp[1], bs, 'baby', t, 1, Math.sin(t * 3) * 0.05);
    // rock covers the cave
    const rk = sm((t - 5.35) / 0.45); if (rk > 0) { const dy = -300 * (1 - rk) + Math.sin(rk * Math.PI) * 0; ctx.save(); ctx.translate(CAVE[0], CAVE[1] + dy - 6); ctx.fillStyle = '#8a7a68'; ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-90, 10); ctx.quadraticCurveTo(-100, -110, -10, -130); ctx.quadraticCurveTo(80, -140, 92, -30); ctx.quadraticCurveTo(96, 6, 82, 10); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(-20, -80, 38, 18, -0.3, 0, 7); ctx.fill(); ctx.restore(); }
  }
  // ---- stage part
  if (inStage && t > 6.5) {
    const cr = { kind: 'cronos', x: STAGE[0] - 250, y: STAGE[1] + 30, s: 185, t, ph: 2, pop: pop(t, 6.9, 0.45), look: 0.5 };
    const g2 = { kind: 'gaia', x: STAGE[0] + 290, y: STAGE[1] + 20, s: 175, t, ph: 3, pop: pop(t, 7.2, 0.45), flip: true, look: -0.5 };
    cr.expr = t < 10.9 ? 'neutral' : t < 12.1 ? 'smile' : t < 13.1 ? 'swallow' : 'smug';
    g2.expr = t < 8.4 ? 'neutral' : 'smile'; g2.wink = t > 13.6;
    cr.squash = t > 12.7 && t < 13.2 ? 0.1 * Math.sin((t - 12.7) / 0.5 * Math.PI) : 0;
    const a = [g2.x - 60, g2.y + 50], c1 = [cr.x + 90, cr.y + 110];
    const dl = sm((t - 7.7) / 0.7); const mid = [(a[0] + c1[0]) / 2, a[1] - 110];
    if (t < 10.9) trail(a, mid, c1, dl, z);
    cr.look = t < 12 ? 0.5 : 0; bust(cr); bust(g2);
    // stone
    const sk = pop(t, 7.6, 0.4); let sp = [a[0] + 10, a[1] + 100], ss = 100 * sk, rot = 0;
    if (t > 8.4) { const u = sm((t - 8.4) / 1.2); sp = bez([a[0] + 10, a[1] + 100], [mid[0], mid[1] + 40], [c1[0] + 40, c1[1] + 60], u); rot = u * 6.28; }
    if (t > 10.9) sp = [c1[0] + 40, c1[1] + 60];
    if (t > 12.1) { const u = sm((t - 12.1) / 0.55); sp = [c1[0] + 40 + (cr.x - c1[0] - 40) * u, c1[1] + 60 + (cr.y - 20 - c1[1] - 60) * u]; ss *= 1 - 0.85 * u; if (t > 12.65) ss = 0; rot = u * 3; }
    bundle(sp[0], sp[1], ss, 'stone', t, 1, rot);
  }
  ctx.restore();
  // inset: meanwhile, the baby is safe (picture-in-picture)
  if (t > 13.3) { const k = sm((t - 13.3) / 0.45), r = 165 * k, ix = W / 2 + 40, iy = 210; ctx.save(); ctx.beginPath(); ctx.arc(ix, iy, r, 0, 7); ctx.clip(); ctx.translate(ix - W / 2, iy - H / 2); drawWorld(1.7, CRETE[0] + 110, CRETE[1] - 80, t, { crete: 0 }); ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1.7, 1.7); ctx.translate(-(CRETE[0] + 110), -(CRETE[1] - 80));
    mount(CAVE[0], CAVE[1], 300, '#a98d5c'); ctx.fillStyle = '#2a170c'; ctx.beginPath(); ctx.moveTo(CAVE[0] - 60, CAVE[1]); ctx.quadraticCurveTo(CAVE[0] - 60, CAVE[1] - 130, CAVE[0], CAVE[1] - 135); ctx.quadraticCurveTo(CAVE[0] + 60, CAVE[1] - 130, CAVE[0] + 60, CAVE[1]); ctx.closePath(); ctx.fill();
    bundle(CAVE[0], CAVE[1] - 40, 70, 'baby', t, 1, Math.sin(t * 2) * 0.04); ctx.font = '700 46px Georgia'; ctx.fillStyle = '#fff'; ctx.fillText('z', CAVE[0] + 50, CAVE[1] - 100 - ((t * 20) % 30)); ctx.restore(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(ix, iy, r, 0, 7); ctx.lineWidth = 8; ctx.strokeStyle = '#fffaf0'; ctx.stroke(); ctx.restore(); }
  // paper grain + vignette
  ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = NOISE; ctx.fillRect(0, 0, W, H); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.0); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(30,18,6,.42)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  caption(t);
}
window.DUR = window.END; window.render = t => frame(t); window.READY = true; frame(0);
