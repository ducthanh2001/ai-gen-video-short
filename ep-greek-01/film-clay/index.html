// Clay figures: Gaia hides baby Zeus, hands Cronos the stone, Cronos swallows it (Theogony 479-491). render(t) seconds.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });

const scene = new THREE.Scene(); scene.background = new THREE.Color('#26140d');
scene.fog = new THREE.Fog('#26140d', 5, 11);
const cam = new THREE.PerspectiveCamera(32, W / H, 0.05, 30);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------- helpers

const K = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const a = keys[i - 1], b = keys[i]; return a[1] + (b[1] - a[1]) * sm((t - a[0]) / (b[0] - a[0])); } return keys[keys.length - 1][1]; };
function noiseTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) { const v = 90 + rnd() * 90 | 0; x.fillStyle = `rgba(${v},${v},${v},.28)`; x.beginPath(); x.arc(rnd() * 256, rnd() * 256, rnd() * 7 + 1, 0, 7); x.fill(); }

const BUMP = noiseTex();
const mat = (c, r = 0.78, bs = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0, bumpMap: BUMP, bumpScale: bs });
const mesh = (g, m, p = [0, 0, 0], s = [1, 1, 1]) => { const o = new THREE.Mesh(g, m); o.position.set(...p); o.scale.set(...s); o.castShadow = true; o.receiveShadow = true; return o; };

function rock(r, col, detail = 3, amp = 0.28) {

  const ph = [rnd() * 9, rnd() * 9, rnd() * 9];
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = v.clone().normalize();
    const d = 1 + amp * (Math.sin(n.x * 3.1 + ph[0]) * .5 + Math.sin(n.y * 4.3 + ph[1]) * .35 + Math.sin(n.z * 2.7 + ph[2]) * .5) * .5; v.multiplyScalar(d); p.setXYZ(i, v.x, v.y, v.z); }

}

// ---------------------------------------------------------------- set
const key = new THREE.DirectionalLight('#ffd9a6', 2.6); key.position.set(-2.6, 3.8, 3.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 12 }); key.shadow.bias = -0.0004; key.shadow.radius = 5;
scene.add(key);
scene.add(new THREE.HemisphereLight('#b9c9ff', '#7a4426', 0.75));
const rim = new THREE.DirectionalLight('#a8c8ff', 1.5); rim.position.set(2.4, 2.4, -3.2); scene.add(rim);
const glowL = new THREE.PointLight('#ffb15e', 6, 7, 1.6); glowL.position.set(0, 1.3, -2.2); scene.add(glowL);

// floor with a faint meander ring
{
  const c = document.createElement('canvas'); c.width = c.height = 1024; const x = c.getContext('2d');
  x.fillStyle = '#b8602b'; x.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(${rnd() < .5 ? '90,40,15' : '230,150,90'},${rnd() * .07})`; x.beginPath(); x.arc(rnd() * 1024, rnd() * 1024, rnd() * 14 + 2, 0, 7); x.fill(); }
  x.translate(512, 512); x.strokeStyle = 'rgba(30,14,8,.55)'; x.lineWidth = 7;
  for (const R of [300, 330]) { x.beginPath(); x.arc(0, 0, R, 0, 7); x.stroke(); }
  x.lineWidth = 6; const n = 64; for (let i = 0; i < n; i++) { const a = i / n * 6.2832; x.save(); x.rotate(a); x.beginPath(); x.moveTo(306, 0); x.lineTo(306, 9); x.lineTo(324, 9); x.lineTo(324, -9); x.lineTo(312, -9); x.lineTo(312, 3); x.stroke(); x.restore(); }
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(4.2, 96), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.85, bumpMap: BUMP, bumpScale: 0.6 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
}
// cave mouth: glow + ring of rocks
{
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'); const g = x.createRadialGradient(256, 256, 10, 256, 256, 256);
  g.addColorStop(0, '#fff2cf'); g.addColorStop(.45, '#ffc77a'); g.addColorStop(1, 'rgba(255,150,70,0)'); x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 5.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, toneMapped: false, fog: false }));
  glow.position.set(0, 1.25, -3.1); scene.add(glow);
  const cols = ['#6b4a38', '#5a3d2e', '#7a5640', '#4d3427'];
  for (let i = 0; i < 17; i++) { const a = Math.PI * (i / 16); const r = rock(0.5 + rnd() * 0.36, cols[i % 4]); r.position.set(Math.cos(a) * 2.7, Math.sin(a) * 2.1 + 0.05, -2.2 - rnd() * 0.4); r.scale.set(1.1, 1 + rnd() * .5, 0.9); scene.add(r); }
  for (let i = 0; i < 9; i++) { const a = Math.PI * (i / 8); const r = rock(0.55 + rnd() * .3, cols[(i + 1) % 4]); r.position.set(Math.cos(a) * 3.4, Math.sin(a) * 2.8 - .1, -1.6 - rnd() * .5); scene.add(r); }
  for (const [x0, z0, s] of [[-2.1, 0.5, .5], [2.2, 0.2, .62], [1.35, -0.55, .36], [-1.2, -1.0, .4], [0.4, -1.5, .35]]) { const r = rock(s, '#6a4a38'); r.position.set(x0, s * .45, z0); r.scale.y = .8; scene.add(r); }
}

// ---------------------------------------------------------------- figures
function makeFigure(o) {
  const root = new THREE.Group();
  const skin = mat(o.skin, .6, .5), cloth = mat(o.robe, .8), trim = mat(o.trim || '#ecd9a6', .7), hairM = mat(o.hair, .9, 1.2);
  const hip = new THREE.Group(); hip.position.y = 0.30; root.add(hip);
  const legs = [];
  for (const s of [-1, 1]) {
    const L = new THREE.Group(); L.position.set(s * 0.07, 0, 0); hip.add(L);
    L.add(mesh(new THREE.CapsuleGeometry(0.05, 0.22, 6, 12), skin, [0, -0.14, 0]));
    L.add(mesh(new THREE.SphereGeometry(0.06, 14, 10), mat('#5b3820'), [0, -0.285, 0.03], [0.9, 0.55, 1.5]));
    legs.push(L);
  }
  // skirt / tunic hangs from the root (does not follow torso lean)
  const prof = o.long ? [[0.33, 0.0], [0.29, 0.12], [0.22, 0.26], [0.152, 0.36], [0.125, 0.41], [0.0, 0.43]] : [[0.205, 0.13], [0.19, 0.23], [0.15, 0.34], [0.13, 0.37], [0.0, 0.38]];
  const skirt = mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 40), cloth); skirt.material.side = THREE.DoubleSide; root.add(skirt);
  const hem = mesh(new THREE.TorusGeometry(prof[0][0] - 0.003, 0.012, 8, 48), trim, [0, prof[0][1] + 0.01, 0]); hem.rotation.x = Math.PI / 2; root.add(hem);
  const torso = new THREE.Group(); hip.add(torso);
  const chest = mesh(new THREE.CapsuleGeometry(0.135, 0.25, 8, 20), cloth, [0, 0.22, 0], [1, 1, 0.78]); torso.add(chest);
  const belt = mesh(new THREE.TorusGeometry(0.139, 0.014, 8, 36), trim, [0, 0.065, 0], [1, 0.8, 1]); belt.rotation.x = Math.PI / 2; belt.scale.set(1, 0.8, 1); if (o.long) belt.visible = false; torso.add(belt);
  torso.add(mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.09, 14), skin, [0, 0.47, 0]));
  // head
  const head = new THREE.Group(); head.position.y = 0.60; torso.add(head);
  head.add(mesh(new THREE.SphereGeometry(0.115, 36, 28), skin, [0, 0, 0], [1, 1.06, 1]));
  const eyes = [], brows = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(s * 0.046, 0.022, 0.1); head.add(e);
    e.add(mesh(new THREE.SphereGeometry(0.0235, 18, 14), new THREE.MeshStandardMaterial({ color: '#fbf6ea', roughness: .35 }), [0, 0, 0], [1, 1.08, .65]));
    e.add(mesh(new THREE.SphereGeometry(0.0125, 14, 10), new THREE.MeshStandardMaterial({ color: '#150d09', roughness: .2 }), [s * 0.002, 0, 0.011]));
    eyes.push(e);
    const b = new THREE.Group(); b.position.set(s * 0.05, 0.066, 0.098); head.add(b);
    const bm = mesh(new THREE.CapsuleGeometry(0.0075, 0.034, 4, 8), o.browCol ? mat(o.browCol, .9) : hairM); bm.rotation.z = Math.PI / 2; b.add(bm); b.userData.s = s; brows.push(b);
    head.add(mesh(new THREE.SphereGeometry(0.024, 12, 10), skin, [s * 0.113, -0.004, 0.0], [0.6, 1, 0.9]));
    head.add(mesh(new THREE.SphereGeometry(0.021, 12, 10), new THREE.MeshStandardMaterial({ color: '#e29a86', roughness: .8 }), [s * 0.066, -0.026, 0.088], [1, .8, .35]));
  }
  head.add(mesh(new THREE.SphereGeometry(0.021, 14, 12), skin, [0, -0.01, 0.113]));
  const mouthMat = new THREE.MeshStandardMaterial({ color: '#4a1510', roughness: .5 });
  const mouth = mesh(new THREE.SphereGeometry(0.02, 16, 12), mouthMat, [0, -0.056, 0.1], [1.6, 0.14, 0.5]); head.add(mouth);
  const smile = mesh(new THREE.TorusGeometry(0.027, 0.0055, 6, 20, Math.PI), mouthMat, [0, -0.03, 0.104]); smile.rotation.z = Math.PI; smile.visible = false; head.add(smile);
  // hair
  const cap = mesh(new THREE.SphereGeometry(0.129, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.55), hairM, [0, 0.004, -0.008]); cap.rotation.x = -0.8; head.add(cap);
  if (o.long) { head.add(mesh(new THREE.SphereGeometry(0.1, 20, 16), hairM, [0, -0.15, -0.065], [1.08, 2.1, 0.8])); }
  if (o.beard) {
    head.add(mesh(new THREE.SphereGeometry(0.086, 20, 16), hairM, [0, -0.15, 0.04], [1.08, 1.15, 0.85]));
    const mu = mesh(new THREE.CapsuleGeometry(0.0125, 0.07, 4, 8), hairM, [0, -0.035, 0.106]); mu.rotation.z = Math.PI / 2; head.add(mu);
    for (const s of [-1, 1]) head.add(mesh(new THREE.SphereGeometry(0.04, 12, 10), hairM, [s * 0.1, -0.035, -0.01], [0.8, 2, 1]));
  }
  if (o.wreath) for (let i = 0; i < 12; i++) { const a = i / 12 * 6.2832; const l = mesh(new THREE.SphereGeometry(0.024, 10, 8), mat(i % 3 ? '#5f8f3c' : '#7fae4a', .7), [Math.cos(a) * 0.122, 0.065 + Math.sin(a * 2) * .008, Math.sin(a) * 0.122 - .01], [1.4, .5, 1]); l.rotation.y = -a; head.add(l); }

  const arm = {};
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(s * 0.165, 0.385, 0); torso.add(sh);
    sh.add(mesh(new THREE.SphereGeometry(0.044, 14, 12), cloth));
    sh.add(mesh(new THREE.CapsuleGeometry(0.037, 0.15, 6, 12), cloth, [0, -0.1, 0]));
    const el = new THREE.Group(); el.position.y = -0.2; sh.add(el);
    el.add(mesh(new THREE.CapsuleGeometry(0.031, 0.13, 6, 12), skin, [0, -0.085, 0]));
    const hand = mesh(new THREE.SphereGeometry(0.04, 14, 12), skin, [0, -0.2, 0.004]); el.add(hand);
    arm[s] = { sh, el, hand };
  }
  root.scale.setScalar(o.scale || 1);
  return { root, hip, torso, head, eyes, brows, mouth, smile, legs, arm, chest, hairM, o };
}
// P: { arm:{1:{f,o,b},-1:{...}}, lean, headYaw, headPitch, headRoll, mouth, mw, tilt, rise, walk, t }
function pose(F, P) {

  for (const s of [-1, 1]) {
    const a = P.arm[s] || { f: 0.05, o: 0.08, b: 0.15 }, A = F.arm[s];
    const sw = walk * Math.sin(P.ph) * 0.5 * (s === 1 ? 1 : -1);

    A.el.rotation.set(-(a.b ?? 0.15), 0, 0);

  }

  F.torso.rotation.set(P.lean || 0, 0, 0); F.torso.scale.y = 1 + 0.012 * Math.sin(t * 2.2);
  F.head.rotation.set(P.headPitch || 0, P.headYaw || 0, P.headRoll || 0);
  const sml = (P.mouth || 0) > 0.3 ? 0 : (P.smile || 0);
  F.smile.visible = sml > 0.02; F.smile.scale.set(0.6 + 0.4 * sml, 0.3 + 0.7 * sml, 1);
  F.mouth.scale.set((P.mw || 1.6), sml > 0.5 ? 0.001 : Math.max(0.14, P.mouth ?? 0.14), 0.5 + (P.mouth || 0) * 0.5);

const gaia = makeFigure({ skin: '#e6b48f', robe: '#4f7a45', trim: '#f0dca4', hair: '#2a1710', long: true, wreath: true, scale: 1.2 });
const cronos = makeFigure({ skin: '#d49a74', robe: '#7c3d4e', trim: '#e7c778', hair: '#9a9488', browCol: '#8a857a', beard: true, scale: 1.05 });
scene.add(gaia.root, cronos.root);

// bundles
const cream = mat('#efe3c6', .85, 1.1);
function makeBaby() {
  const g = new THREE.Group(), skinB = mat('#e9b894', .6, .3), dark = mat('#2a1710', .3);
  const body = mesh(new THREE.CapsuleGeometry(0.052, 0.09, 6, 14), cream); body.rotation.z = Math.PI / 2; g.add(body);
  for (const x of [-0.04, 0.0, 0.04]) { const b = mesh(new THREE.TorusGeometry(0.053, 0.007, 6, 20), mat('#c9b27a', .8), [x, 0, 0]); b.rotation.y = Math.PI / 2; g.add(b); }
  g.add(mesh(new THREE.SphereGeometry(0.056, 20, 16), skinB, [0.125, 0.02, 0]));
  for (const dz of [-0.02, 0.02]) g.add(mesh(new THREE.SphereGeometry(0.0085, 8, 6), dark, [0.168 - 0.0, 0.03, dz]));
  g.add(mesh(new THREE.SphereGeometry(0.016, 10, 8), mat('#e29a86'), [0.172, 0.0, 0.0], [0.5, 0.7, 1.3]));
  const tuft = mesh(new THREE.ConeGeometry(0.03, 0.06, 10), cream, [-0.105, 0, 0]); tuft.rotation.z = Math.PI / 2; g.add(tuft);
  g.scale.setScalar(1.5); return g;
}
function makeStone() { const g = new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(0.083, 24, 18), cream, [0, 0, 0], [1, 0.92, 1])); const st = rock(0.052, '#8d877d', 2, .35); st.position.y = 0.07; g.add(st);
  for (const y of [-0.02, 0.025]) { const b = mesh(new THREE.TorusGeometry(0.081 * Math.sqrt(1 - (y / .083) ** 2) + .002, 0.008, 6, 28), mat('#c9b27a', .8), [0, y, 0]); b.rotation.x = Math.PI / 2; g.add(b); } return g; }
const baby = makeBaby(), stone = makeStone(); scene.add(baby, stone);
const gulp = mesh(new THREE.SphereGeometry(0.036, 14, 12), mat('#d49a74', .6, .3), [0, 0.5, 0.105]); cronos.torso.add(gulp);

// ---------------------------------------------------------------- timeline
const DUR = 14;
const HOLD = { f: 1.0, b: 1.35, o: -0.32 }, OFFER = { f: 1.3, b: 0.5, o: -0.14 }, DOWN = { f: 0.06, b: 0.15, o: 0.08 }, MOUTH = { f: 1.25, b: 1.9, o: -0.2 }, PAT = { f: 0.55, b: 1.25, o: -0.35 }, FOLD = { f: 0.6, b: 1.65, o: -0.5 };
const mix = (A, B, k) => ({ f: A.f + (B.f - A.f) * k, b: A.b + (B.b - A.b) * k, o: A.o + (B.o - A.o) * k });
const seq = (t, list) => { // list [[t, pose], ...] eased
  if (t <= list[0][0]) return list[0][1];
  for (let i = 1; i < list.length; i++) if (t <= list[i][0]) return mix(list[i - 1][1], list[i][1], sm((t - list[i - 1][0]) / (list[i][0] - list[i - 1][0])));
  return list[list.length - 1][1];
};
const mid = (F, v) => { const a = new THREE.Vector3(), b = new THREE.Vector3(); F.arm[1].hand.getWorldPosition(a); F.arm[-1].hand.getWorldPosition(b); return v.copy(a).add(b).multiplyScalar(0.5); };
const NICHE = new THREE.Vector3(1.22, 0.1, -0.22);

const CAP = [[0.2, 3.4, 'In a cave on a mountain, Gaia takes the baby from her, and hides him.'], [3.5, 6.2, 'To Cronos, Gaia gives a great stone, wrapped in baby clothes.'], [6.3, 7.1, 'He takes it.'], [7.2, 9.0, 'He swallows it.'], [9.4, 12.4, 'And he never notices.']];
const capEl = document.getElementById('cap'), bub = document.getElementById('bub'); let capKey = '';
function chunks(a, b, text) { const w = text.split(' '), out = []; let cur = []; for (const x of w) { cur.push(x); if (cur.length >= 4 || /[,.]$/.test(x)) { out.push(cur); cur = []; } } if (cur.length) out.push(cur);
  const tot = w.length; let k = 0; return out.map(ws => { const s = a + (b - a) * k / tot; k += ws.length; return { s, e: a + (b - a) * k / tot, ws, k0: k - ws.length }; }); }
const CH = CAP.flatMap(([a, b, t]) => chunks(a, b, t).map(c => ({ ...c, a, b })));
function caption(t) {
  const c = CH.find(c => t >= c.s && t < c.e + 0.0001); if (!c) { capEl.innerHTML = ''; capKey = ''; return; }
  const per = (c.e - c.s) / c.ws.length, on = Math.min(c.ws.length - 1, Math.floor((t - c.s) / per));
  const k = c.s + '|' + on; if (k === capKey) return; capKey = k;
  capEl.innerHTML = c.ws.map((w, i) => `<span class="${i === on ? 'on' : ''}">${w}</span>`).join('');
}

const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), tmp = new THREE.Vector3();
function draw(t) {
  // ---- Gaia
  const gArms = seq(t, [[0, HOLD], [3.4, HOLD], [3.8, DOWN], [4.0, DOWN], [4.6, HOLD], [5.3, HOLD], [5.9, OFFER], [6.3, OFFER], [6.9, DOWN], [10.2, DOWN], [10.8, FOLD]]);
  const lean = K(t, [[0, 0], [2.3, 0], [3.0, 0.5], [3.5, 0.5], [3.9, 0], [14, 0]]);
  const gHeadYaw = K(t, [[0, 0.2], [1.2, 0.15], [2.6, -0.1], [3.8, 0.1], [4.3, 0.55], [6.4, 0.5], [7.0, 0.1], [9.2, 0.0], [11.0, 0.15], [11.9, 0.95], [14, 0.95]]);
  const gHeadPitch = K(t, [[0, 0], [2.6, 0.25], [3.4, 0.25], [4, 0], [14, 0]]);
