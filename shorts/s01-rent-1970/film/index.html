// ---------------------------------------------------------------- scene
const tl = new THREE.TextureLoader(), base = '/core/assets/polyhaven/';

// ---------------------------------------------------------------- piles: which coins exist, and when each one falls
// returns the drop time of coin i, -1e9 when it is already resting, or null when it is not on the desk
function dropA(i, t) {
  if (t < TL.STORY_A) return -1e9;                        // hook: the 1970 pile is complete
  if (t < TL.BUILD_A) return null;                        // the story starts from an empty receipt

}
function dropB(i, t) {
  if (t < TL.STORY_A) return i < TL.B_HOOK0 ? -1e9 : (i - TL.B_HOOK0) * TL.B_HOOK_DT;   // hook: still raining

function pose(k, u, i, x, y, z, h0) {

// ---------------------------------------------------------------- overlay
function font(px, w = 800) { return `${w} ${px * S}px "Mona Sans", system-ui, sans-serif`; }

function bigNumber(t, t0, big, sub, color = '#ffffff') {
  const k = fadeIn(t, t0, .35); c2.globalAlpha = k;
  shadowed(() => { scaled(1 + (1 - k) * .06, 70, 330, () => text(big, 70, 330, 170, color, 900)); text(sub, 74, 410, 44, 'rgba(255,255,255,.92)', 600); });
  c2.globalAlpha = 1;
}
function monthBar(t, hours, t0, final, color) {           // 0..240 h, the 1-month line at 173.3 h
  const k = fadeIn(t, t0, .3), x0 = 70, x1 = 1010, y = 520, wpx = x1 - x0, m = x0 + wpx * 173.3 / 240;
  c2.globalAlpha = k;
  c2.fillStyle = 'rgba(255,255,255,.18)'; c2.fillRect(x0 * S, y * S, wpx * S, 26 * S);
  c2.fillStyle = color; c2.fillRect(x0 * S, y * S, wpx * Math.min(1, hours / 240) * S, 26 * S);
  c2.fillStyle = '#ffffff'; c2.fillRect((m - 2) * S, (y - 18) * S, 4 * S, 62 * S);
  shadowed(() => { text('1 MONTH OF FULL-TIME WORK (173 h)', m, y - 30, 26, '#ffffff', 700, 'center', 1); if (final) text(final, x0, y + 78, 40, color, 800); });
  c2.globalAlpha = 1;
}
function caption(t) {
  for (const [id, t0] of Object.entries(TL.VO)) {
    if (t < t0 - .05 || t > t0 + DURV[id] + .25) continue;
    const k = Math.min(fadeIn(t, t0 - .05, .15), 1 - clamp((t - (t0 + DURV[id] + .05)) / .2));
    c2.font = font(50, 700); const words = CAP[id].split(' '), lines = []; let line = '';
    for (const w of words) { const s = line ? line + ' ' + w : w; if (c2.measureText(s).width > 860 * S && line) { lines.push(line); line = w; } else line = s; } lines.push(line);
    const lh = 64, y0 = 1470 - (lines.length - 1) * lh / 2;
    c2.globalAlpha = k;
    lines.forEach((l, j) => { const wpx = c2.measureText(l).width / S + 40; c2.fillStyle = 'rgba(12,9,6,.62)';
      c2.beginPath(); c2.roundRect((540 - wpx / 2) * S, (y0 + j * lh - 50) * S, wpx * S, 64 * S, 14 * S); c2.fill(); text(l, 540, y0 + j * lh, 50, '#ffffff', 700, 'center'); });
    c2.globalAlpha = 1;
  }
}

let landedA = 0, landedB = 0;
const pileTop = n => Math.ceil(n / 4) * coinH * 1.02;
function overlay(t) {
  c2.clearRect(0, 0, W, H); scrim();
  if (t < TL.STORY_A) {                                                   // hook
    shadowed(() => { text('ONE MONTH OF RENT', 70, 160, 40, '#ffffff', 700, 'left', 5);
      text('1970 vs TODAY', 70, 320, 132, '#ffffff', 900); text('in hours of minimum-wage work', 74, 395, 44, 'rgba(255,255,255,.92)', 600); });
    if (t < TL.VO.h2 + .4) { tag('1970', '', ZA[0], pileTop(landedA) + .01, 0, '#ffd9a0'); tag('TODAY', '', ZB[0], pileTop(landedB) + .01, 0, '#ff8a6a'); }
  } else if (t < TL.CUT_ENV) bigNumber(t, TL.STORY_A + .1, '$108', 'a month · median rent, 1970');
  else if (t < TL.BUILD_A) bigNumber(t, TL.CUT_ENV + .1, '$1.60', 'an hour · federal minimum wage');
  else if (t < TL.WHIP) {
    const n = t >= TL.LOCK_A ? '67.5' : String(Math.min(68, landedA));
    shadowed(() => { scaled(pop(t, TL.LOCK_A), 70, 330, () => text(`${n} HOURS`, 70, 330, 150, '#ffd9a0', 900)); text('to pay one month of rent, 1970', 74, 405, 42, 'rgba(255,255,255,.92)', 600); });
    if (t >= TL.BAR_A) monthBar(t, 67.5 * clamp((t - TL.BAR_A) / .6), TL.BAR_A, t > TL.BAR_A + .6 ? '39% of a month' : '', '#ffd9a0');
  } else if (t < TL.WHIP_END) { /* whip: clean frame */ }
  else if (t < TL.CUT_STUB) bigNumber(t, TL.WHIP_END + .05, '$1,487', 'a month · median rent, 2024');
  else if (t < TL.BUILD_B) bigNumber(t, TL.CUT_STUB + .1, '$7.25', 'an hour · unchanged since 2009');
  else if (t < TL.END) {
    const locked = t >= TL.LOCK_B, n = locked ? '205' : String(Math.min(205, landedB));
    shadowed(() => { scaled(pop(t, TL.LOCK_B), 70, 330, () => text(`${n} HOURS`, 70, 330, 150, locked ? '#ff8a6a' : '#ffffff', 900)); text('to pay one month of rent, today', 74, 405, 42, 'rgba(255,255,255,.92)', 600); });
    monthBar(t, Math.min(205.1, landedB), TL.BUILD_B + .1, t >= TL.LOCK_B ? '118% of a month' : '', '#ff8a6a');
  } else {                                                                // ending: back to the opening frame
    const k = fadeIn(t, TL.END + .8, .5); c2.globalAlpha = k;
    shadowed(() => { text('ONE MONTH OF RENT', 70, 160, 40, '#ffffff', 700, 'left', 5); text('1970 vs TODAY', 70, 320, 132, '#ffffff', 900); text('in hours of minimum-wage work', 74, 395, 44, 'rgba(255,255,255,.92)', 600); });
    c2.globalAlpha = 1;
    if (t > TL.END + 1.2) { c2.globalAlpha = fadeIn(t, TL.END + 1.2, .4); tag('1970', '67.5 h', ZA[0], pileTop(68) + .01, 0, '#ffd9a0'); tag('TODAY', '205 h', ZB[0], pileTop(205) + .01, 0, '#ff8a6a'); c2.globalAlpha = 1; }
    text('Sources: U.S. Census Bureau (1970 Census, ACS 2024), U.S. Dept. of Labor', 540, 1840, 22, 'rgba(255,255,255,.6)', 500, 'center');
  }
  caption(t);
}

function draw(t) {
  camAt(t);
  landedA = placePile(pileA, TL.A_N, ZA, dropA, t, 0);
  landedB = placePile(pileB, TL.B_N, ZB, dropB, t, 900);
  post.composer.render();
  overlay(t);
}

(async () => {
  await Promise.all([
    loadFont('Mona Sans', 'https://cdn.jsdelivr.net/npm/@fontsource-variable/mona-sans@5.3.0/files/mona-sans-latin-standard-normal.woff2'),
    loadFont('IBM Plex Mono', 'https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/files/ibm-plex-mono-latin-700-normal.woff2'),
    loadFont('Geist Mono', 'https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/files/geist-mono-latin-wght-normal.woff2')]);
  makeTextures(); await build();
  window.DUR = TL.DUR; window.TL = TL; window.render = x => draw(RATE ? x / RATE : x); draw(0); window.READY = true;
})();
</script></body></html>
